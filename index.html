<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Type-Blitz // Synthwave Terminal Typing Game</title>
  <link rel="stylesheet" href="/node_modules/@xterm/xterm/css/xterm.css" />

<body>
